<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Photo Album - Niagara Falls</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Playfair+Display:ital,wght@0,400;1,600&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Playfair+Display:ital,wght@0,400;1,600&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #f0eadd;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Playfair Display', serif;
  }

  .album-music {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 1000;
  }

  .album-scene {
    perspective: 1500px;
    width: 900px;
    height: 600px;
    position: relative;
    display: flex;
  }

  .page-right {
    position: absolute;
    right: 0;
    width: 50%;
    height: 100%;
    background-color: #fdfbf7;
    box-shadow: inset 5px 0 15px rgba(0,0,0,0.1), 10px 10px 20px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    padding: 15px 25px;
    border-radius: 0 8px 8px 0;
    z-index: 1;
    border-left: 2px solid #e3dec9; 
  }

  .leaf {
    position: absolute;
    right: 0; 
    width: 50%;
    height: 100%;
    transform-origin: left center;
    transform-style: preserve-3d;
    transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1);
    cursor: pointer;
  }

  #leaf1 { z-index: 3; }
  #leaf2 { z-index: 2; }

  .leaf.flipped {
    transform: rotateY(-180deg);
  }

  .face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 0 8px 8px 0;
  }

  .face.front {
    background-color: #fdfbf7;
    display: flex;
    flex-direction: column;
    padding: 15px 25px;
    box-shadow: inset 5px 0 15px rgba(0,0,0,0.1);
    border-left: 2px solid #e3dec9; 
  }

  .face.front.cover {
    background-color: #AEC6CF; /* Pastel Blue */
    align-items: center;
    justify-content: center;
    padding: 0;
    box-shadow: inset 5px 0 15px rgba(0,0,0,0.3), 5px 5px 15px rgba(0,0,0,0.4);
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.02) 75%, rgba(255,255,255,0.02)), 
                      repeating-linear-gradient(-45deg, rgba(255,255,255,0.02) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.02) 75%, rgba(255,255,255,0.02));
    background-size: 4px 4px;
    border-left: none;
  }

  .spiral-binding {
    position: absolute;
    left: -15px;
    top: 2%;
    height: 96%;
    width: 30px;
    background: repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 15px,
      #b8860b 15px,
      #8b6508 20px,
      transparent 20px,
      transparent 30px
    );
    z-index: 10;
  }

  .corner {
    position: absolute;
    width: 40px;
    height: 40px;
    border: 3px solid #d4af37;
  }
  .corner-top-right { top: 10px; right: 10px; border-bottom: none; border-left: none; }
  .corner-bottom-right { bottom: 10px; right: 10px; border-top: none; border-left: none; }

  .cover-photo-slot {
    width: 75%;
    aspect-ratio: 4/3;
    background: #000;
    margin-bottom: 25px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.1);
    overflow: hidden;
  }
  .cover-photo-slot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    cursor: pointer;
  }
  .cover-title {
    color: #ffffff; 
    text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    font-size: 22px;
    letter-spacing: 8px;
    text-transform: uppercase;
  }

  .cover-date-input {
    background: transparent;
    border: none;
    color: #ffffff;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    letter-spacing: 4px;
    text-align: center;
    margin-top: 15px;
    outline: none;
    width: 60%;
  }

  .face.back {
    background-color: #fdfbf7;
    transform: rotateY(180deg);
    box-shadow: inset -5px 0 15px rgba(0,0,0,0.1);
    border-radius: 8px 0 0 8px;
    display: flex;
    flex-direction: column;
    padding: 15px 25px;
    border-left: none;
  }

  .travel-tag {
    position: absolute;
    top: 15px;
    right: 25px;
    font-family: 'Caveat', cursive;
    font-size: 26px;
    color: #557A95;
    font-weight: bold;
    z-index: 5;
    pointer-events: none;
  }
  .face.back .travel-tag {
    left: 25px; 
    right: auto;
  }
  
  .layout-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 10px;
    width: 100%;
    height: 100%;
    margin-top: 25px;
  }

  .top-section {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .bottom-section {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .photo-frame {
    background: #fff;
    padding: 8px 8px 22px 8px;
    box-shadow: 2px 4px 10px rgba(0,0,0,0.15);
    width: 48%;
    transform: rotate(-2deg);
    transition: transform 0.3s;
  }
  .photo-frame:nth-child(even) {
    transform: rotate(2deg);
  }
  .photo-frame:hover {
    transform: rotate(0deg) scale(1.05);
    z-index: 10;
  }
  
  .photo-frame img {
    width: 100%;
    aspect-ratio: 1/1;
    object-fit: cover;
    background: #e0e0e0;
    cursor: pointer;
  }

  .text-block {
    width: 48%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 5px;
  }

  /* Đã giảm size tiêu đề từ 30px xuống 23px để vừa vặn không bị khuất chữ */
  .page-title {
    font-family: 'Caveat', cursive;
    font-size: 23px;
    color: #333;
    border: none;
    background: transparent;
    outline: none;
    margin-bottom: 5px;
    text-align: center;
    width: 100%;
  }

  /* Đã giảm size đoạn văn từ 18px xuống 16px và tăng line-height lên 1.3 */
  .scrapbook-text {
    font-family: 'Dancing Script', cursive;
    font-size: 16px; 
    color: #555;
    background: transparent;
    border: none;
    resize: none;
    width: 100%;
    height: 130px;
    outline: none;
    line-height: 1.3; 
    text-align: center;
  }

  .photo-frame, .text-block, .cover-date-input, .cover-title {
    cursor: default; 
  }
  .photo-frame img, .cover-photo-slot img {
    cursor: pointer; 
  }

  .modal {
    visibility: hidden;
    opacity: 0;
    position: fixed;
    z-index: 2000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.85);
    display: flex;
    justify-content: center;
    align-items: center;
    transition: opacity 0.3s ease, visibility 0.3s ease;
  }
  .modal.active {
    visibility: visible;
    opacity: 1;
  }
  .modal-content {
    max-width: 85%;
    max-height: 85%;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    border: 8px solid #fff;
    border-radius: 4px;
    transform: scale(0.8);
    transition: transform 0.3s ease;
    object-fit: contain;
  }
  .modal.active .modal-content {
    transform: scale(1);
  }
  .close-btn {
    position: absolute;
    top: 20px;
    right: 40px;
    color: #fff;
    font-size: 50px;
    font-weight: bold;
    cursor: pointer;
    transition: color 0.2s;
  }
  .close-btn:hover {
    color: #d4af37;
  }
</style>
</head>
<body>

<audio class="album-music" controls autoplay loop>
  <source src="piano music can be so simple, yet so beautiful.mp3" type="audio/mpeg">
</audio>

<div class="album-scene" id="album">
  
  <!-- Fixed Back Page (Đã thêm khung ảnh ở phần dưới) -->
  <div class="page-right">
    <div class="travel-tag">Memories</div>
    <div class="layout-grid">
      <div class="top-section" style="justify-content: center;">
        <div class="text-block" style="width: 85%;">
          <input type="text" class="page-title" value="Until Next Time" readonly>
          <textarea class="scrapbook-text" style="height: 50px;" readonly>Khép lại hành trình chiêm ngưỡng sức mạnh của thiên nhiên.</textarea>
        </div>
      </div>
      <div class="bottom-section">
        <div class="text-block">
          <textarea class="scrapbook-text" style="height: 120px;" readonly>Những bọt nước trắng xóa rợp trời nơi đây sẽ còn đọng mãi trong trí nhớ.</textarea>
        </div>
        <!-- Bạn thay tên file hình ảnh mới vào thuộc tính src dưới đây nhé -->
        <div class="photo-frame"><img src="775398419_4146967452267810_6243366821019590514_n.jpg" alt="Final Memory"></div>
      </div>
    </div>
  </div>

  <!-- Leaf 2 -->
  <div class="leaf" id="leaf2">
    <div class="face front" onclick="flipLeaf('leaf2', true, event)">
      <div class="travel-tag">Discover</div>
      <div class="layout-grid">
        <div class="top-section">
          <div class="photo-frame"><img src="20260726_134509.jpg" alt="Rainbow Bridge"></div>
          <div class="text-block">
            <input type="text" class="page-title" value="Rainbow Bridge" readonly>
            <textarea class="scrapbook-text" readonly>Cây cầu "Rainbow" huyền thoại, vắt ngang ranh giới nối liền hai thành phố của New York (Mỹ) và Ontario (Canada).</textarea>
          </div>
        </div>
        <div class="bottom-section">
          <div class="text-block">
            <input type="text" class="page-title" value="Vào lòng thác" readonly>
            <textarea class="scrapbook-text" readonly>Góc nhìn trực diện từ dưới lên khi băng qua lớp sương mù dày đặc trên con tàu nhỏ. Trải nghiệm ướt sũng nhưng cực đã!</textarea>
          </div>
          <div class="photo-frame"><img src="20260726_133534.jpg" alt="Boat view"></div>
        </div>
      </div>
    </div>
    <div class="face back" onclick="flipLeaf('leaf2', false, event)">
      <div class="travel-tag">Explore</div>
      <div class="layout-grid">
        <div class="top-section">
          <div class="photo-frame"><img src="20260726_132712.jpg" alt="View across river"></div>
          <div class="text-block">
            <input type="text" class="page-title" value="Bờ bên kia" readonly>
            <textarea class="scrapbook-text" readonly>Dòng sông xanh thẫm trôi lững lờ trước khi cuộn trào xuống những bậc đá khổng lồ. Phía xa là ngọn tháp Skylon vươn cao.</textarea>
          </div>
        </div>
        <div class="bottom-section">
          <div class="text-block">
            <input type="text" class="page-title" value="Sức mạnh thiên nhiên" readonly>
            <textarea class="scrapbook-text" readonly>Đứng ngay tại mép thác, nghe âm thanh dòng nước đổ ầm ầm và bọt nước bắn tung tóe thực sự vô cùng choáng ngợp!</textarea>
          </div>
          <div class="photo-frame"><img src="20260726_140237.jpg" alt="Close up waterfall edge"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Leaf 1 (Cover) -->
  <div class="leaf" id="leaf1">
    <div class="face front cover" onclick="flipLeaf('leaf1', true, event)">
      <div class="spiral-binding"></div>
      <div class="corner corner-top-right"></div>
      <div class="corner corner-bottom-right"></div>
      
      <div class="cover-photo-slot">
        <img src="20260726_130113.jpg" alt="Niagara Falls State Park Sign">
      </div>
      
      <h1 class="cover-title">Thác Niagara</h1>
      <input type="text" class="cover-date-input" value="New York - 07/26/2026" readonly>
    </div>

    <div class="face back" onclick="flipLeaf('leaf1', false, event)">
      <div class="travel-tag">Wanderlust</div>
      <div class="layout-grid">
        <div class="top-section">
          <div class="photo-frame"><img src="20260726_131029.jpg" alt="Wide view of falls"></div>
          <div class="text-block">
            <input type="text" class="page-title" value="Toàn cảnh" readonly>
            <textarea class="scrapbook-text" readonly>View bao trọn khung cảnh hùng vĩ của một trong những thác nước nổi tiếng nhất thế giới với các cao ốc phía xa.</textarea>
          </div>
        </div>
        <div class="bottom-section">
          <div class="text-block">
            <input type="text" class="page-title" value="Dòng nước đổ" readonly>
            <textarea class="scrapbook-text" readonly>Đứng từ trên cao ngắm nhìn từng dòng nước xiết cuồn cuộn đổ xuống vực sâu. Quá đã mắt!</textarea>
          </div>
          <div class="photo-frame"><img src="20260726_140052.jpg" alt="Elevated view"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<div id="imageModal" class="modal" onclick="closeModal()">
  <span class="close-btn">&times;</span>
  <img class="modal-content" id="modalImg">
</div>

<script>
  let currentZ = 10; 

  document.addEventListener('DOMContentLoaded', () => {
    const music = document.querySelector('.album-music');
    if (music) {
      music.volume = 0.4; 
      music.play().catch(() => {
        const startOnInteraction = () => {
          music.play();
          document.removeEventListener('click', startOnInteraction);
          document.removeEventListener('keydown', startOnInteraction);
        };
        document.addEventListener('click', startOnInteraction);
        document.addEventListener('keydown', startOnInteraction);
      });
    }
  });

  function flipLeaf(leafId, forward, event) {
    if(event) {
      if (
        event.target.closest('.photo-frame') ||
        event.target.closest('.text-block') ||
        event.target.closest('.cover-photo-slot') ||
        ['input', 'textarea', 'img'].includes(event.target.tagName.toLowerCase())
      ) {
        return; 
      }
      event.stopPropagation(); 
    }

    const music = document.querySelector('.album-music');
    if (music && music.paused) {
      music.volume = 0.4;
      music.play().catch(error => console.log("Playback error:", error));
    }

    const leaf = document.getElementById(leafId);
    
    currentZ++;
    leaf.style.zIndex = currentZ;

    if(forward) {
      leaf.classList.add('flipped');
    } else {
      leaf.classList.remove('flipped');
    }
  }

  document.querySelectorAll('.photo-frame img, .cover-photo-slot img').forEach(img => {
    img.addEventListener('click', function(e) {
      e.stopPropagation(); 
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImg');
      modalImg.src = this.src;
      modal.classList.add('active');
    });
  });

  function closeModal() {
    document.getElementById('imageModal').classList.remove('active');
  }
</script>

</body>
</html>
